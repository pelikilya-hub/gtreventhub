# Проект Xcode собирается из этого файла: brew install xcodegen && xcodegen
name: MoyaRaduga
options:
  bundleIdPrefix: com.moyaraduga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MoyaRaduga:
    type: application
    platform: iOS
    sources:
      - path: MoyaRaduga
        excludes: ["**/*.txt"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moyaraduga.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: MoyaRaduga/Info.plist
      properties:
        CFBundleDisplayName: Моя радуга
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Адрес выкаченного сервера (воркер moya-raduga).
        RadugaServer: https://moya-raduga.gameiskra.workers.dev
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Камера нужна, чтобы примерять маски и ставить рисунки в комнате.
        UIAppFonts:
          - BalsamiqSans-Regular.ttf
          - BalsamiqSans-Bold.ttf
          - Neucha.ttf
