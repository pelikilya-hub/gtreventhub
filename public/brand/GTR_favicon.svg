<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GTR">
  <!-- Фирменный знак GTR для вкладки браузера.
       Это НЕ уменьшенная эмблема: прицельное кольцо, брызги и подпись на
       шестнадцати пикселях превращаются в грязь. Здесь остаётся то, что
       переживает такой размер — чёрный квадрат, красный разлом и три
       белые литеры во всю ширину. Разлом идёт ЗА буквами и выходит в
       промежутки между ними: пущенный поверх, он читался как
       запрещающий знак, а не как фирменная диагональ. -->
  <rect width="512" height="512" rx="96" fill="#0A0B0D"/>

  <!-- разлом: от правого верха к левому низу, под литерами -->
  <path d="M356 40 L436 40 L188 472 L108 472 Z" fill="#E5231B"/>
  <!-- тонкий спутник разлома — след, как в эмблеме -->
  <path d="M446 96 L470 96 L360 288 L336 288 Z" fill="#E5231B" opacity=".55"/>

  <!-- полоса вордмарка: как в эмблеме, литеры сидят в тёмном поле со
       скобками по краям. Одна полоса вместо подложек под каждой литерой —
       иначе разлом рубится о них прямоугольными зазубринами. -->
  <rect x="22" y="166" width="468" height="180" fill="#0A0B0D"/>
  <g fill="#FFFFFF">
    <rect x="22" y="166" width="13" height="180"/>
    <rect x="477" y="166" width="13" height="180"/>
    <rect x="22" y="166" width="50" height="12"/>
    <rect x="22" y="334" width="50" height="12"/>
    <rect x="440" y="166" width="50" height="12"/>
    <rect x="440" y="334" width="50" height="12"/>
  </g>

  <!-- GTR: блочные литеры в характере эмблемы, сетка 116×150, штрих 32 -->
  <g transform="translate(50,181)" fill="#FFFFFF">
    <!-- G -->
    <g>
      <rect x="0" y="0" width="116" height="32"/>
      <rect x="0" y="0" width="32" height="150"/>
      <rect x="0" y="118" width="116" height="32"/>
      <rect x="84" y="68" width="32" height="82"/>
      <rect x="56" y="68" width="60" height="32"/>
    </g>
    <!-- T -->
    <g transform="translate(148,0)">
      <rect x="0" y="0" width="116" height="32"/>
      <rect x="42" y="0" width="32" height="150"/>
    </g>
    <!-- R -->
    <g transform="translate(296,0)">
      <rect x="0" y="0" width="32" height="150"/>
      <rect x="0" y="0" width="116" height="32"/>
      <rect x="84" y="0" width="32" height="82"/>
      <rect x="0" y="64" width="116" height="32"/>
      <path d="M52 96 H90 L116 150 H78 Z"/>
    </g>
  </g>
</svg>
