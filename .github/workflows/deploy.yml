# Выкатка прода: мердж в main уезжает в Cloudflare сам.
#
# До этого файла деплой был ручной командой из DEPLOY.md, и это стоило
# ровно того, чего и должно было: 30 августа выяснилось, что в проде
# крутится сборка от 28-го, а семь смердженных за день работ лежат в
# main и никуда не едут. Снаружи это выглядит как «ничего не менялось» —
# самая дорогая разновидность поломки, потому что о ней никто не знает.
#
# Сборка та же, что руками: npm run deploy:cf. Внутри — генерация
# публичных данных, сборка под cloudflare_module, страж check-wrangler
# (он уронит выкатку, если из конфига пропал биндинг KV, кроны или
# домен) и собственно wrangler deploy.
#
# Без секрета CLOUDFLARE_API_TOKEN в настройках репозитория этот файл
# безвреден: шаг проверки остановит выкатку с понятным текстом, а не
# уронит её посреди деплоя.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Ручной запуск из вкладки Actions — на случай, когда надо
  # перевыкатить без нового коммита.
  workflow_dispatch:

# Две выкатки подряд не должны обгонять друг друга: последняя обязана
# оказаться последней и в проде.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Проверить, что токен задан
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Нет секрета CLOUDFLARE_API_TOKEN. Settings → Secrets and variables → Actions → New repository secret. Токен — по шаблону «Edit Cloudflare Workers»."
            exit 1
          fi

      - run: npm ci

      # Тесты до выкатки, а не после. Красный прод чинится минутами,
      # но эти минуты гость проводит на чужом сайте.
      - run: npm test

      # Причина отказа должна быть видна там, где её можно прочитать.
      #
      # Полный лог прогона GitHub отдаёт с отдельного хоста, и не всякий
      # клиент до него добирается — разбор первой же неудачи упёрся
      # ровно в это. Поэтому вывод wrangler ловим в файл и при отказе
      # выносим хвост в аннотацию: она видна и в API, и на странице
      # прогона, и в письме о падении.
      - name: Выкатить
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Идентификатор аккаунта секретом не является — он и так лежит
          # в DEPLOY.md. Секретом можно переопределить, если аккаунт
          # сменится.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2e3f6f6ab8e81085ca7022ebeb583868' }}
        run: |
          set -o pipefail
          if npm run deploy:cf 2>&1 | tee /tmp/deploy.log; then
            exit 0
          fi
          echo "### Выкатка упала" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 /tmp/deploy.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # В аннотацию — только строки, похожие на причину, и каждая
          # отдельным сообщением: перевод строки внутри ::error:: его
          # обрывает, поэтому многострочный текст туда не положить.
          grep -iE "error|✘|✗|denied|unauthoriz|forbidden|permission|\[code: ?[0-9]+\]" /tmp/deploy.log \
            | tail -n 12 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1

      # Сверка после выкатки: отпечаток сборки в проде обязан стать
      # свежим. Молчаливо «успешный» деплой, не доехавший до воркера, —
      # ровно та поломка, из-за которой этот файл и появился.
      #
      # Новая версия расходится по краю Cloudflare не мгновенно: 16 октября
      # сверка через 15 секунд увидела старую сборку и покрасила выкатку,
      # а через пару минут прод отдавал свежую. Поэтому спрашиваем до
      # восьми раз с паузой 15 секунд — две минуты на распространение —
      # и падаем, только если свежая сборка так и не появилась.
      - name: Проверить, что прод обновился
        run: |
          for TRY in 1 2 3 4 5 6 7 8; do
            sleep 15
            BUILD=$(curl -sS --max-time 20 -H "User-Agent: deploy-check" https://gtrevent.com/api/version | sed 's/[^0-9]//g')
            NOW=$(date +%s000)
            if [ -n "$BUILD" ]; then
              AGE=$(( (NOW - BUILD) / 1000 ))
              echo "попытка $TRY: отпечаток сборки в проде $BUILD, возраст ${AGE}s"
              if [ "$AGE" -le 900 ]; then
                exit 0
              fi
            else
              echo "попытка $TRY: /api/version не ответил"
            fi
          done
          echo "::error::Прод за две минуты так и не отдал сборку моложе 15 минут — выкатка не доехала."
          exit 1
